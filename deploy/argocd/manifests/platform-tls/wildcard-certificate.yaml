# One certificate for every internal UI name. It lives in the ingress-nginx namespace because
# ingress-nginx serves it as its default certificate (values/ingress-nginx.yaml), so no other namespace
# needs a copy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-recruitai
  namespace: ingress-nginx
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the issuers
spec:
  secretName: wildcard-recruitai-tls
  dnsNames:
    - "*.recruitai.io.vn"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    # Production. Before changing the issuer, know what the change does:
    # - On a running cluster, cert-manager issues again at once (the Secret's issuer annotations no
    #   longer match), and within 10 minutes the PushSecret copies that certificate over the backup,
    #   medical-rag/wildcard-tls. Take the cluster down first (make down).
    # - On a rebuild, the restore (platform-secrets/wildcard-tls-restore.yaml) stamps issuer
    #   annotations on the backed-up certificate. If they differ from issuerRef here (name, kind or
    #   group), cert-manager issues a new certificate over it and the PushSecret backs that up. If they
    #   match, cert-manager keeps the backed-up certificate without checking who signed it.
    # So any certificate issued by staging replaces the production backup. Save medical-rag/wildcard-tls
    # to disk first, and put the production version back, with the cluster down, before returning to
    # letsencrypt-production.
    name: letsencrypt-production
