# The chart installs its CRDs (ExternalSecret, ClusterSecretStore, the generators). This is why the
# Application runs one wave before anything that creates those resources.
installCRDs: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
